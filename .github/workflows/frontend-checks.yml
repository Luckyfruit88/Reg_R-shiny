name: Frontend synthetic checks
on:
  push:
    branches: ["frontend/ux-safety-20261009"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ui:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: r-lib/actions/setup-r@v2
        timeout-minutes: 5
        with:
          r-version: '4.5.2'
          use-public-rspm: true
      - name: Install native-free UI test dependencies
        timeout-minutes: 5
        run: |
          Rscript -e 'install.packages(c("shiny", "bslib", "DT", "future", "promises", "later", "jsonlite", "data.table", "processx"))'
      - name: Check UI structure and display binding
        run: Rscript tests/test_frontend_contract.R
      - name: Check mocked jobs, review gates and result identity
        run: Rscript tests/test_variant_ui.R
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install browser test tools
        timeout-minutes: 5
        run: |
          python -m pip install playwright==1.58.0
          python -m playwright install --with-deps chromium
      - name: Check audit-table geometry in Chromium
        timeout-minutes: 5
        run: |
          mkdir -p test-artifacts/audit-layout
          Rscript tests/audit_layout_app.R > test-artifacts/audit-layout/shiny.log 2>&1 &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true' EXIT
          python tests/inspect_audit_layout.py || { tail -n 100 test-artifacts/audit-layout/shiny.log; exit 1; }
          python tests/test_audit_layout_browser.py || { tail -n 100 test-artifacts/audit-layout/shiny.log; exit 1; }
      - name: Preserve synthetic browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: audit-layout-evidence
          path: test-artifacts/audit-layout/
          if-no-files-found: ignore
          retention-days: 7
